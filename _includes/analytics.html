{%- comment -%}
  Umami Cloud analytics (no cookies, no personal data, so no consent banner needed).
  Renders only in production builds and only when umami_id is set in _config.yml.
{%- endcomment -%}
{% if jekyll.environment == "production" and site.umami_id != "" %}
<script defer src="https://cloud.umami.is/script.js" data-website-id="{{ site.umami_id }}"></script>
{% endif %}
