{%- comment -%}
  Google Analytics 4. Renders only in production builds and only when ga4_id is set in _config.yml.
{%- endcomment -%}
{% if jekyll.environment == "production" and site.ga4_id != "" %}
<script async src="https://www.googletagmanager.com/gtag/js?id={{ site.ga4_id }}"></script>
<script>
window.dataLayer = window.dataLayer || [];
function gtag(){dataLayer.push(arguments);}
gtag('js', new Date());
gtag('config', '{{ site.ga4_id }}', { anonymize_ip: true });
</script>
{% endif %}
