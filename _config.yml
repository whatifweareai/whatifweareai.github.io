title: "The Hum"
subtitle: "What If? We Are AI"
tagline: "A quest for peace through knowing."
author: "S Asok"
description: "A memoir and an argument: what if we are not the programmers but the model?"
lang: en

# User/org site (repo whatifweareai.github.io) served at the root, so baseurl is empty.
url: "https://whatifweareai.github.io"
baseurl: "https://whatifweareai.github.io"

markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: ["apos", "apos", "quot", "quot"]
  hard_wrap: false

# Keep search engines out until the author decides otherwise.
noindex: true

exclude: [docs, graft, Gemfile, Gemfile.lock, README.md, vendor, .bundle]
