title: "The Hum"
subtitle: "What If? We Are AI"
tagline: "A quest for peace through knowing."
author: "S Asok"
description: "A memoir and an argument: what if we are not the programmers but the model? The Hum is a Kindle ebook by S Asok, on Amazon India, US and Canada."
asin: "B0HPS662S6"
buy_links:
  - label: "Amazon India"
    url: "https://www.amazon.in/Hum-What-If-We-Are-ebook/dp/B0HPS662S6/"
  - label: "Amazon US"
    url: "https://www.amazon.com/dp/B0HPS662S6"
  - label: "Amazon Canada"
    url: "https://www.amazon.ca/dp/B0HPS662S6"
lang: en

# Served at the root of the custom domain, so baseurl is empty.
url: "https://whatifweareai.com"
baseurl: ""

markdown: kramdown
kramdown:
  input: GFM
  smart_quotes: ["apos", "apos", "quot", "quot"]
  hard_wrap: false

# false lets search engines list the site. true adds a noindex tag and blocks crawling in robots.txt.
noindex: false

exclude: [docs, graft, Gemfile, Gemfile.lock, README.md, vendor, .bundle]
