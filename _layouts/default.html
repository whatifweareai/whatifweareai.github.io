<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if site.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
<title>{% if page.title %}{{ page.title }} — {% endif %}{{ site.title }}: {{ site.subtitle }}</title>
<meta name="description" content="{{ site.description }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="book">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{{ site.title }}: {{ site.subtitle }}">
<meta property="og:description" content="{{ site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/img/cover.jpg' | absolute_url }}">
<meta property="og:image:alt" content="Cover of {{ site.title }}: {{ site.subtitle }}">
<meta name="twitter:card" content="summary">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Book",
  "name": {{ site.title | append: ": " | append: site.subtitle | jsonify }},
  "alternateName": {{ site.title | jsonify }},
  "author": { "@type": "Person", "name": {{ site.author | jsonify }} },
  "description": {{ site.description | jsonify }},
  "image": {{ '/assets/img/cover.jpg' | absolute_url | jsonify }},
  "url": {{ '/' | absolute_url | jsonify }},
  "bookFormat": "https://schema.org/EBook",
  "inLanguage": {{ site.lang | jsonify }},
  "identifier": { "@type": "PropertyValue", "propertyID": "ASIN", "value": {{ site.asin | jsonify }} },
  "sameAs": {{ site.buy_links | map: "url" | jsonify }}
}
</script>
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<header class="site">
  <a href="{{ '/' | relative_url }}">{{ site.title }}</a>
  <span>{{ site.subtitle }}</span>
</header>
<main>
{{ content }}
</main>
<footer class="site">
  <p>This is a work of fiction, until science proves it to be the truth.</p>
  <p>&copy; 2026 {{ site.author }}. All rights reserved.</p>
</footer>
</body>
</html>
