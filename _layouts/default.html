<!DOCTYPE html>
<html lang="{{ site.lang }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
{% if site.noindex %}<meta name="robots" content="noindex, nofollow">{% endif %}
<title>{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}: {{ site.subtitle }}</title>
<meta name="description" content="{{ page.description | default: site.description }}">
<link rel="canonical" href="{{ page.url | absolute_url }}">
<meta property="og:type" content="book">
<meta property="og:site_name" content="{{ site.title }}">
<meta property="og:title" content="{% if page.title %}{{ page.title }} | {% endif %}{{ site.title }}: {{ site.subtitle }}">
<meta property="og:description" content="{{ page.description | default: site.description }}">
<meta property="og:url" content="{{ page.url | absolute_url }}">
<meta property="og:image" content="{{ '/assets/img/cover.jpg' | absolute_url }}">
<meta property="og:image:alt" content="Cover of {{ site.title }}: {{ site.subtitle }}">
<meta name="twitter:card" content="summary">
<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "Book",
  "name": {{ site.title | append: ": " | append: site.subtitle | jsonify }},
  "alternateName": {{ site.title | jsonify }},
  "author": { "@type": "Person", "name": {{ site.author | jsonify }} },
  "description": {{ site.description | jsonify }},
  "image": {{ '/assets/img/cover.jpg' | absolute_url | jsonify }},
  "url": {{ '/' | absolute_url | jsonify }},
  "bookFormat": "https://schema.org/EBook",
  "inLanguage": {{ site.lang | jsonify }},
  "identifier": { "@type": "PropertyValue", "propertyID": "ASIN", "value": {{ site.asin | jsonify }} },
{% assign priced = site.buy_links | where_exp: "l", "l.price" %}  "offers": [{% for l in priced %}
    { "@type": "Offer", "price": {{ l.price | jsonify }}, "priceCurrency": {{ l.currency | jsonify }}, "url": {{ l.url | jsonify }}, "availability": "https://schema.org/InStock" }{% unless forloop.last %},{% endunless %}{% endfor %}
  ],
  "sameAs": {{ site.buy_links | map: "url" | jsonify }}
}
</script>
<meta name="theme-color" content="#0D1B36">
<link rel="preload" href="{{ '/assets/fonts/literata.woff2' | relative_url }}" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
<div class="page">
<main>
{{ content }}
</main>
<footer class="site">
  <p>This is a work of fiction, until science proves it to be the truth.</p>
  <p>&copy; 2026 {{ site.author }}. All rights reserved.</p>
</footer>
</div>
</body>
</html>
